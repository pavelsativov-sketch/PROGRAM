[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "E702", "B904", "E712", "UP007", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
