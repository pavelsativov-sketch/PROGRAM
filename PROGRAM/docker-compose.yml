services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-floral}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-floralpass}
      POSTGRES_DB: ${DB_NAME:-floral}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-floral}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.5"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-floral}:${DB_PASSWORD:-floralpass}@db:5432/${DB_NAME:-floral}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set in .env (generate: python -c \"from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())\")}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      PAY_SIGNING_KEY: ${PAY_SIGNING_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      WA_BRIDGE_URL: http://wa-bridge:3001
      WA_BRIDGE_SECRET: ${WA_BRIDGE_SECRET:?set in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      ENV: ${ENV:-prod}
    volumes:
      - ig-sessions:/app/ig_sessions
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  wa-bridge:
    build: ./whatsapp-bridge
    environment:
      PORT: 3001
      BRIDGE_SECRET: ${WA_BRIDGE_SECRET:?set in .env}
      BACKEND_WEBHOOK: http://backend:8000/api/channels/whatsapp/webhook
    volumes:
      - wa-sessions:/app/.wa-sessions
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Chromium съедает 400-700M на сессию; ставим 1.5G на 1-3 магазина.
          memory: 1536M
          cpus: "1.5"

  frontend:
    build: ./frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.3"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  # Простой ежедневный pg_dump в volume `db-backups`.
  # Хранит 14 последних дампов (pg_dump -Fc, ~5-50MB/дамп).
  db-backup:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-floral}
      PGPASSWORD: ${DB_PASSWORD:-floralpass}
      PGDATABASE: ${DB_NAME:-floral}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - db-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /backups
        echo "[backup] starting daily loop; retention=${BACKUP_RETENTION_DAYS} days"
        while true; do
          TS=$$(date -u +%Y%m%dT%H%M%SZ)
          OUT="/backups/$${PGDATABASE}-$${TS}.dump"
          echo "[backup] $$(date -u +%FT%TZ) -> $${OUT}"
          if pg_dump -Fc -f "$${OUT}.tmp"; then
            mv "$${OUT}.tmp" "$${OUT}"
            echo "[backup] ok: $$(ls -lh $${OUT} | awk '{print $$5}')"
          else
            echo "[backup] FAILED" >&2
            rm -f "$${OUT}.tmp"
          fi
          # Удаляем дампы старше N дней.
          find /backups -name "*.dump" -type f -mtime +$${BACKUP_RETENTION_DAYS} -delete || true
          sleep 86400
        done
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  db-data:
  db-backups:
  redis-data:
  ig-sessions:
  wa-sessions:
  caddy-data:
  caddy-config:
